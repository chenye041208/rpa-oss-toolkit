name: Publish to PyPI

on:
  push:
    branches: [master]
    paths:
      - "setup.py"
      - "rpa_oss_toolkit/__init__.py"
      - "rpa_oss_toolkit/**/*.py"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/* --disable-progress-bar --non-interactive
